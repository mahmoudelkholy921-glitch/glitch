<title>قاموس تواصل الكويتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: navy brand band with logo chip, sticky search + category chips, then a two-column translation list (Egyptian -> Kuwaiti). */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --line:#DDE2F0; --fg:#1B2340; --muted:#5E6786;
  --blue:#34498A; --blue-ink:#34498A; --orange:#E1612A; --orange-soft:#FDEBE2; --band:#34498A; --band-fg:#FFFFFF; --chip-bg:#FFFFFF;
  --font-display:'Cairo','Tajawal',system-ui,sans-serif; --font-body:'Tajawal','Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1326; --surface:#161D38; --line:#262F54; --fg:#E9ECF7; --muted:#9AA4C6;
  --blue-ink:#9FB1F0; --orange:#F27B42; --orange-soft:#3A2418; --band:#1A2450; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1326; --surface:#161D38; --line:#262F54; --fg:#E9ECF7; --muted:#9AA4C6;
  --blue-ink:#9FB1F0; --orange:#F27B42; --orange-soft:#3A2418; --band:#1A2450; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-fg);border-bottom:5px solid var(--orange)}
header .wrap{display:flex;align-items:center;gap:20px;padding-block:22px;flex-wrap:wrap}
.logo{background:var(--chip-bg);border-radius:14px;padding:8px 12px;display:flex;flex:none}
.logo img{display:block;height:58px;width:auto}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,4.5vw,34px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:4px 0 0;opacity:.85;font-size:15px}
.titles{min-width:0;flex:1 1 240px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.search:focus-within{border-color:var(--orange)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;padding:13px 0;outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-weight:500;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--blue-ink)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1a0d05}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1a0d05}}
.count{margin-inline-start:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
main{padding-block:20px 48px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 18px 8px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em}
.cols span:last-child{color:var(--orange)}
.group{margin:22px 0 10px;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--blue-ink);display:flex;align-items:center;gap:10px}
.group::after{content:"";flex:1;height:2px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;position:relative}
.row .e{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .k{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--blue-ink);min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px;justify-content:space-between}
.copy{flex:none;font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:3px 10px;cursor:pointer}
.copy:hover{color:var(--orange);border-color:var(--orange)}
.copy.done{background:var(--orange-soft);color:var(--orange);border-color:var(--orange)}
.empty{text-align:center;color:var(--muted);padding:48px 0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
footer{color:var(--muted);font-size:13px;text-align:center;padding-bottom:32px}
@media (max-width:560px){
  .cols{display:none}
  .row{grid-template-columns:1fr;gap:2px}
  .row .e::before{content:"مصري: ";font-size:12px}
  .logo img{height:46px}
}
</style>
